{% extends "base.html" %}
{% block title %}Create Business Page · Gather World{% endblock %}
{% block content %}
<section class="phase79-wrap"><header class="page-heading"><div><span class="section-kicker">PHASE 8 · BUSINESS PRESENCE</span><h1>Create a business page</h1><p>Introduce your organization. New pages are labelled unverified until reviewed.</p></div><a class="btn btn-secondary" href="{{ url_for('businesses_directory') }}">Business directory</a></header><section class="panel-card phase79-form"><form class="form-stack" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>Business name<input name="name" maxlength="90" required></label><label>Page URL nickname<input name="slug" maxlength="50" placeholder="example-business"><small>Lowercase letters, numbers and hyphens.</small></label><label>Category<select name="category">{% for item in categories %}<option value="{{ item }}">{{ item }}</option>{% endfor %}</select></label><label>Description<textarea name="description" maxlength="1500"></textarea></label><label>Website (HTTPS)<input type="url" name="website_url" placeholder="https://example.com"></label><label>Public contact email<input type="email" name="contact_email"></label><label>Location<input name="location" maxlength="140" placeholder="City, country"></label><button class="btn" type="submit">Create page</button></form></section></section>
{% endblock %}
