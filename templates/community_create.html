{% extends "base.html" %}
{% block title %}Create a Community · Gather World{% endblock %}
{% block content %}
<section class="community-form-wrap">
  <a class="back-link" href="{{ url_for('community_list') }}">← All communities</a>
  <div class="panel community-form-panel">
    <span class="tag">BUILD YOUR SPACE</span><h1>Create a community</h1><p>Choose a clear name and address. You can update the details later.</p>
    <form method="post" class="form-stack">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <label>Community name<input name="name" maxlength="70" required placeholder="e.g. Photography Club" value="{{ request.form.get('name','') }}"></label>
      <label>Community address<input name="slug" maxlength="40" required pattern="[a-z0-9-]{3,40}" placeholder="photography-club" value="{{ request.form.get('slug','') }}"><small>3–40 lowercase letters, numbers or hyphens. This becomes your community URL.</small></label>
      <label>Short description<textarea name="description" maxlength="600" rows="3" placeholder="What is this community about?">{{ request.form.get('description','') }}</textarea></label>
      <div class="community-form-row"><label>Category<select name="category">{% for item in categories %}<option value="{{ item }}">{{ item }}</option>{% endfor %}</select></label><label>Visibility<select name="visibility"><option value="public">Public — anyone can view and join</option><option value="private">Private — members need approval</option></select></label></div>
      <label>Community rules<textarea name="rules" maxlength="3000" rows="4" placeholder="Be respectful, stay on topic…">{{ request.form.get('rules','') }}</textarea></label>
      <div class="community-form-actions"><a class="btn btn-secondary" href="{{ url_for('community_list') }}">Cancel</a><button class="btn" type="submit">Create community ↗</button></div>
    </form>
  </div>
</section>
{% endblock %}
