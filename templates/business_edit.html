{% extends "base.html" %}
{% block title %}Edit {{ business.name }} · Gather World{% endblock %}
{% block content %}
<section class="phase79-wrap"><header class="page-heading"><div><span class="section-kicker">BUSINESS SETTINGS</span><h1>Edit {{ business.name }}</h1><p>Keep your public business details up to date.</p></div></header><section class="panel-card phase79-form"><form class="form-stack" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>Business name<input name="name" maxlength="90" value="{{ business.name }}" required></label><label>Category<select name="category">{% for item in categories %}<option value="{{ item }}" {% if item==business.category %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label><label>Description<textarea name="description" maxlength="1500">{{ business.description }}</textarea></label><label>Website (HTTPS)<input type="url" name="website_url" value="{{ business.website_url }}"></label><label>Public contact email<input type="email" name="contact_email" value="{{ business.contact_email }}"></label><label>Location<input name="location" maxlength="140" value="{{ business.location }}"></label><label class="check-row"><input type="checkbox" name="is_public" value="1" {% if business.is_public %}checked{% endif %}> Public listing</label><button class="btn" type="submit">Save changes</button></form></section></section>
{% endblock %}
